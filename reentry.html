<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reentry Challenge v4</title>
<style>
:root{--bg:#06111d;--panel:#0f2438;--text:#eef7ff;--muted:#b5c8da;--accent:#ffd13d;--good:#4be187;--warn:#ff9e3d;--bad:#ff4e62;--blue:#66caff;font-family:"Atkinson Hyperlegible","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box} html,body{height:100%;overflow:hidden}
body{margin:0;height:100dvh;background:radial-gradient(circle at top,#163653,#06111d 62%,#02060b);color:var(--text)}
.app{height:100dvh;max-height:100dvh;overflow:hidden;display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);gap:10px;padding:10px;max-width:1460px;margin:0 auto}
.card{background:linear-gradient(180deg,rgba(17,42,65,.96),rgba(8,21,34,.98));border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.32);overflow:hidden}
.sidebar{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
h1{font-size:28px;line-height:1;margin:0}.subtitle{color:var(--muted);line-height:1.35;font-size:14px}
.mission{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);border-radius:14px;padding:10px;cursor:pointer;transition:.15s}
.mission:hover{background:rgba(255,255,255,.09)}.mission.active{outline:3px solid rgba(255,209,61,.55);background:rgba(255,209,61,.13)}
.mission b{display:block;margin-bottom:2px}.mission span{display:block;color:var(--muted);font-size:13px;line-height:1.25}
.btn{border:0;border-radius:14px;padding:12px 13px;font-weight:1000;font-size:15px;color:#06111d;background:linear-gradient(180deg,#ffe275,#f5b71f);box-shadow:0 4px 0 rgba(105,76,0,.85);cursor:pointer}
.btn:active,.btn.down{transform:translateY(3px);box-shadow:0 1px 0 rgba(105,76,0,.85)}.btn.secondary{background:linear-gradient(180deg,#ddf5ff,#72cdfc);box-shadow:0 4px 0 rgba(0,67,108,.8)}
.btn.danger{background:linear-gradient(180deg,#ff858c,#ff4e62);box-shadow:0 4px 0 rgba(116,0,14,.82);color:#fff}
.stage{height:calc(100dvh - 20px);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-bottom:1px solid rgba(255,255,255,.13);flex:0 0 auto}
.gauge{background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.11);border-radius:13px;padding:8px}
.gauge label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:1000;letter-spacing:.06em}
.bar{height:11px;border-radius:999px;background:rgba(0,0,0,.38);overflow:hidden;margin-top:7px}.fill{height:100%;width:0%;border-radius:999px;background:var(--blue);transition:width .12s linear}
#canvasWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#081521}canvas{display:block;width:100%;height:100%;background:#081521}
.overlay{position:absolute;left:14px;top:14px;background:rgba(4,14,24,.76);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:12px 14px;max-width:min(475px,calc(100% - 28px))}
.phase{font-weight:1000;color:var(--accent);font-size:17px;letter-spacing:.04em}.guidance{font-size:15px;line-height:1.3;margin-top:4px}
.report{display:none;position:absolute;right:14px;top:14px;width:min(385px,calc(100% - 28px));background:rgba(7,18,30,.94);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.42)}
.report.show{display:block}.report h2{margin:0 0 8px;font-size:25px}.report p{margin:8px 0;color:var(--muted);line-height:1.35}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr 110px;gap:8px;padding:8px;border-top:1px solid rgba(255,255,255,.13);background:rgba(3,10,18,.72);flex:0 0 auto}
.help{font-size:13px;color:var(--muted);line-height:1.35}kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:1px 6px;color:white}
@media(max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:6px;gap:6px}.sidebar{max-height:30dvh;padding:8px}.sidebar h1{font-size:22px}.subtitle,.help{font-size:12px}#missions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mission{padding:8px}.mission b{font-size:13px}.mission span{display:none}.stage{height:auto}.topbar{grid-template-columns:1fr 1fr;padding:6px;gap:6px}.gauge{padding:6px}.bar{height:9px}.controls{grid-template-columns:1fr 1fr;padding:6px}.btn{font-size:13px;padding:10px 8px}.overlay{left:8px;top:8px;padding:8px 10px}.phase{font-size:14px}.guidance{font-size:13px}}
</style>
</head>
<body>
<div class="app"><aside class="card sidebar"><div><h1>Reentry Challenge</h1><div class="subtitle">The capsule stays centered. You control the entry path: too steep burns up, too shallow skips away.</div></div><div id="missions"></div><button class="btn" id="startBtn">Start Reentry</button><button class="btn secondary" id="resetBtn">Reset</button><div class="help">Hold <kbd>▲</kbd> for a shallower path. Hold <kbd>▼</kbd> for a steeper path. Use the parachute only when the screen says <b>CHUTE READY</b>.</div></aside>
<main class="card stage"><div class="topbar"><div class="gauge"><label>HEAT <span id="heatTxt">0%</span></label><div class="bar"><div class="fill" id="heatFill"></div></div></div><div class="gauge"><label>SPEED <span id="speedTxt">0 km/s</span></label><div class="bar"><div class="fill" id="speedFill"></div></div></div><div class="gauge"><label>ALTITUDE <span id="altTxt">0 km</span></label><div class="bar"><div class="fill" id="altFill"></div></div></div><div class="gauge"><label>ENTRY PATH <span id="angleTxt">0°</span></label><div class="bar"><div class="fill" id="angleFill"></div></div></div></div><div id="canvasWrap"><canvas id="game"></canvas><div class="overlay"><div class="phase" id="phaseTxt">READY</div><div class="guidance" id="guideTxt">Choose a mission and start reentry.</div></div><div class="report" id="report"><h2 id="reportTitle">Flight Report</h2><p id="reportBody"></p><button class="btn" id="tryAgainBtn">Try Again</button></div></div><div class="controls"><button class="btn secondary control" id="upBtn">HOLD SHALLOWER ▲</button><button class="btn secondary control" id="downBtn">HOLD STEEPER ▼</button><button class="btn" id="chuteBtn">DEPLOY CHUTE</button><button class="btn danger" id="abortBtn">RESET</button></div></main></div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d'), $=id=>document.getElementById(id), SIM_SPEED=.72;
const missions=[{id:'train',name:'Training Capsule',desc:'Wide safe window and extra guidance.',alt:122,speed:7.4,path:-13,target:700,help:true},{id:'heat',name:'Heat Shield Test',desc:'Keep plasma hot but not dangerous.',alt:124,speed:7.9,path:-12,target:780,help:false},{id:'target',name:'Target Landing',desc:'Survive, slow down, and land near recovery.',alt:118,speed:7.5,path:-14,target:720,help:false},{id:'steep',name:'Emergency Return',desc:'A steeper, faster entry with less margin.',alt:110,speed:8.1,path:-18,target:650,help:false}];
let selected=missions[0], input={up:false,down:false}, state, particles=[];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))} function lerp(a,b,t){return a+(b-a)*t}
function fmtAlt(a){return a>=10?`${a.toFixed(0)} km`:`${Math.max(0,Math.round(a*1000))} m`} function fmtSpeed(s){return s>=1?`${s.toFixed(1)} km/s`:`${Math.round(s*1000)} m/s`}
function defaultState(){return{running:false,outcome:null,t:0,alt:selected.alt,speed:selected.speed,path:selected.path,heat:2,skip:0,range:0,target:selected.target,chute:false,chuteBad:false,maxHeat:0,maxSpeed:selected.speed,finalMiss:0,controlFlash:0,verticalSpeed:0}}
state=defaultState();
function resize(){const r=canvas.parentElement.getBoundingClientRect(),w=Math.max(420,Math.floor(r.width)),h=Math.max(300,Math.floor(r.height));canvas.width=Math.floor(w*devicePixelRatio);canvas.height=Math.floor(h*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function renderMissions(){ $('missions').innerHTML=missions.map(m=>`<div class="mission ${m.id===selected.id?'active':''}" data-id="${m.id}"><b>${m.name}</b><span>${m.desc}</span></div>`).join(''); document.querySelectorAll('.mission').forEach(el=>el.onclick=()=>{selected=missions.find(m=>m.id===el.dataset.id);reset();renderMissions()})}
renderMissions();
function start(){state=defaultState();state.running=true;hideReport();particles=[]} function reset(){state=defaultState();hideReport();particles=[]}
$('startBtn').onclick=start;$('resetBtn').onclick=reset;$('abortBtn').onclick=reset;$('tryAgainBtn').onclick=start;
function holdButton(id,key){const b=$(id),set=v=>{input[key]=v;b.classList.toggle('down',v)};b.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});addEventListener('pointerup',()=>set(false));addEventListener('pointercancel',()=>set(false))}
holdButton('upBtn','up');holdButton('downBtn','down');
addEventListener('keydown',e=>{if(e.key==='ArrowUp')input.up=true;if(e.key==='ArrowDown')input.down=true;if(e.key===' '){e.preventDefault();deployChute()}});addEventListener('keyup',e=>{if(e.key==='ArrowUp')input.up=false;if(e.key==='ArrowDown')input.down=false});$('chuteBtn').onclick=deployChute;
function chuteReady(){return state.alt<12&&state.speed<.78}
function deployChute(){if(!state.running||state.outcome||state.chute)return;if(!chuteReady()){state.chute=true;state.chuteBad=true;end('Parachute Shredded','The parachute opened before the capsule was low and slow. Wait for CHUTE READY.')}else{state.chute=true;burst(40,'chute')}}
function update(dt){dt=Math.min(dt*SIM_SPEED,.045);if(!state.running||state.outcome)return;state.t+=dt;const control=(input.up?1:0)-(input.down?1:0);if(control)state.controlFlash=.18;state.path=lerp(state.path,clamp(state.path+control*20*dt,-28,-5),.72);
const density=clamp(Math.exp(-(state.alt-26)/22),0,1),steepness=clamp((Math.abs(state.path)-5)/23,0,1),shallowRisk=clamp((9-Math.abs(state.path))/5,0,1),sweet=1-Math.abs(Math.abs(state.path)-15)/13;
let descent=state.speed*(.18+steepness*.82);if(state.chute&&!state.chuteBad)descent*=.20;if(selected.help&&state.alt<35&&!state.chute)descent*=.92;state.verticalSpeed=descent;state.alt=Math.max(0,state.alt-descent*dt*3.15);state.range+=state.speed*dt*(52+(1-steepness)*45);
let drag=density*state.speed*state.speed*(.017+(1-steepness)*.026+Math.max(0,sweet)*.013);if(state.chute&&!state.chuteBad)drag+=.55*Math.max(.2,state.speed);if(selected.help&&state.speed>2.1&&state.alt<55)drag*=1.10;state.speed=Math.max((state.chute ? .055 : .14),state.speed-drag*dt);
const heatBuild=density*Math.pow(state.speed,2.45)*(.34+steepness*.82),cooling=(.08+(state.speed<2.2?.42:.12)+((state.chute ? .22 : 0)))*dt;state.heat=clamp(state.heat+heatBuild*dt-cooling*22,0,120);if(selected.help&&state.heat>82)state.heat-=.35;state.maxHeat=Math.max(state.maxHeat,state.heat);state.maxSpeed=Math.max(state.maxSpeed,state.speed);
if(state.alt>58&&state.speed>5.0&&shallowRisk>.05)state.skip+=shallowRisk*dt*44;else state.skip=Math.max(0,state.skip-dt*16);
if(state.heat>=100)end('Burned Up','The entry path was too steep or too fast in thick air. Hold SHALLOWER earlier.');if(state.skip>=100)end('Skipped Out','The entry path was too shallow. The capsule bounced off the upper atmosphere instead of slowing down.');
if(state.alt<=0){const miss=Math.abs(state.range-state.target);state.finalMiss=miss;if(state.chute&&!state.chuteBad&&state.speed<.18&&miss<210)end('Safe Landing',`You survived reentry and landed ${Math.round(miss)} km from the recovery zone.`);else if(state.chute&&!state.chuteBad)end('Hard Landing',`You survived the heat, but landing was rough or far from recovery. Miss: ${Math.round(miss)} km.`);else end('Crash Landing','The capsule reached the ground without a safe parachute descent.')}
if(state.heat>20&&state.speed>1.5&&Math.random()<.7)burst(1,'plasma');if(control&&Math.random()<.8)burst(1,'jet');particles.forEach(p=>p.age+=dt);particles=particles.filter(p=>p.age<p.life);state.controlFlash=Math.max(0,state.controlFlash-dt)}
function end(title,body){if(state.outcome)return;state.outcome=title;state.running=false;$('reportTitle').textContent=title;$('reportBody').innerHTML=`${body}<br><br>Max heat: ${Math.round(state.maxHeat)}%<br>Final speed: ${fmtSpeed(state.speed)}<br>Range error: ${Math.round(Math.abs(state.range-state.target))} km`;$('report').classList.add('show')}
function hideReport(){$('report').classList.remove('show')} function burst(n,type){for(let i=0;i<n;i++)particles.push({type,age:0,life:(type==='plasma' ? .9 : .55),x:(Math.random()-.5)*50,y:(Math.random()-.5)*44,vx:-80-Math.random()*130,vy:(Math.random()-.5)*50,r:type==='plasma'?4+Math.random()*8:3+Math.random()*4})}
function phase(){if(!state.running)return'Ready';if(chuteReady()&&!state.chute)return'CHUTE READY';if(state.alt>92)return'Space';if(state.alt>68)return'Entry Interface';if(state.heat>34&&state.speed>2.0)return'Plasma Around Heat Shield';if(state.alt>14)return'Lower Atmosphere';if(state.chute)return'Parachute Descent';return'Final Descent'}
function guidance(){if(state.outcome)return'Review the flight report and try again.';if(!state.running)return'Start reentry. Keep the path between TOO SHALLOW and TOO STEEP.';if(chuteReady()&&!state.chute)return'CHUTE READY: deploy the parachute now.';if(state.skip>55)return'Too shallow. Hold STEEPER so you do not skip away.';if(state.heat>76)return'Too hot. Hold SHALLOWER so plasma spreads out instead of spiking.';if(state.alt<18&&!state.chute)return'Getting low. Keep slowing down until CHUTE READY appears.';if(state.path<-23)return'Very steep. Heat will build quickly.';if(state.path>-8)return'Very shallow. Watch for skip risk.';return'Good. Keep the capsule in a safe entry path.'}
function draw(){const W=canvas.clientWidth,H=canvas.clientHeight;ctx.clearRect(0,0,W,H);drawBackground(W,H);drawPathGuide(W,H);drawRecoveryTarget(W,H);drawCenteredCapsule(W,H);drawParticles(W,H);drawChute(W,H);drawPathMeter(W,H);drawHud()}
function mix(a,b,t){return a.map((v,i)=>Math.round(lerp(v,b[i],t)))} function css(a){return`rgb(${a[0]},${a[1]},${a[2]})`}
function drawBackground(W,H){const p=clamp((122-state.alt)/122,0,1),top=mix([4,12,26],[72,151,206],clamp((p-.05)/.55,0,1));let bot=mix([8,22,45],[202,103,46],clamp((p-.36)/.28,0,1));bot=mix(bot,[105,164,112],clamp((p-.78)/.22,0,1));const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,css(top));g.addColorStop(1,css(bot));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.save();const speedScroll=state.t*(30+state.speed*35);ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<95;i++){const x=(i*97-state.range*.25)%(W+40)-20,y=(i*53+speedScroll*.25)%(H*.65);ctx.globalAlpha=clamp(1-p*2,0,.75)*(i%8===0?1:.45);ctx.fillRect(x,y,i%9===0?2:1,i%9===0?2:1)}ctx.globalAlpha=1;const lineAlpha=clamp((state.speed-1)/7,0,.55)*clamp((120-state.alt)/90,0,1);ctx.globalAlpha=lineAlpha;ctx.strokeStyle='rgba(225,245,255,.62)';ctx.lineWidth=2;for(let i=0;i<28;i++){const y=(i*43+speedScroll*1.7)%(H+80)-40,x=(i*91-state.range*.55)%(W+160)-80;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-95,y+18);ctx.stroke()}ctx.restore();const groundRise=clamp((16-state.alt)/16,0,1),gy=lerp(H+100,H-50,groundRise);ctx.fillStyle='rgba(68,128,82,.92)';ctx.beginPath();ctx.moveTo(0,gy);ctx.quadraticCurveTo(W*.45,gy-42,W,gy+4);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill()}
function drawPathGuide(W,H){const cx=W*.5,cy=H*.50,safeLo=-22,safeHi=-9;ctx.save();ctx.translate(cx,cy);ctx.globalAlpha=.12;ctx.fillStyle='#4be187';ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,Math.min(W,H)*.56,safeLo*Math.PI/180,safeHi*Math.PI/180,false);ctx.closePath();ctx.fill();ctx.globalAlpha=.9;ctx.strokeStyle='rgba(75,225,135,.78)';ctx.lineWidth=3;ctx.setLineDash([9,8]);for(const a of [safeLo,safeHi]){const r=Math.min(W,H)*.53;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*Math.PI/180)*r,Math.sin(a*Math.PI/180)*r);ctx.stroke()}ctx.setLineDash([]);const a=state.path*Math.PI/180,r=Math.min(W,H)*.35;ctx.strokeStyle=state.path<safeLo||state.path>safeHi?'#ff9e3d':'#ffd13d';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-70*Math.cos(a),-70*Math.sin(a));ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke();const tx=Math.cos(a)*r,ty=Math.sin(a)*r;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx-16*Math.cos(a-.45),ty-16*Math.sin(a-.45));ctx.lineTo(tx-16*Math.cos(a+.45),ty-16*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.font='bold 13px system-ui';ctx.fillStyle='rgba(235,255,245,.9)';ctx.fillText('SAFE ENTRY PATH',20,-95);ctx.fillStyle='rgba(255,190,130,.9)';ctx.fillText('too steep = heat',18,95);ctx.restore()}
function drawRecoveryTarget(W,H){if(state.alt>28)return;const cx=W*.5,miss=(state.target-state.range),x=clamp(cx+miss*.62,80,W-80),y=lerp(H+40,H-50,clamp((12-state.alt)/12,0,1));ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(255,209,61,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-6,96,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(-85,-9,170,8);ctx.fillStyle='rgba(255,209,61,.95)';ctx.fillRect(-52,-20,104,12);ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText('RECOVERY ZONE',0,-31);ctx.restore()}
function drawCenteredCapsule(W,H){const cx=W*.5,cy=H*.50,tilt=(state.path+15)*.95*Math.PI/180;ctx.save();ctx.translate(cx,cy);if(state.heat>12&&state.speed>1.4)drawPlasma();drawLiftBubble();ctx.rotate(tilt);drawCapsuleShape();ctx.restore()}
function drawPlasma(){const intensity=clamp((state.heat-10)/86,0,1),flicker=.78+.22*Math.sin(state.t*20);ctx.save();const grad=ctx.createRadialGradient(-28,14,5,-28,14,92);grad.addColorStop(0,`rgba(255,255,210,${.22*intensity*flicker})`);grad.addColorStop(.24,`rgba(255,207,73,${.42*intensity*flicker})`);grad.addColorStop(.55,`rgba(255,87,33,${.34*intensity})`);grad.addColorStop(1,'rgba(255,66,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(-24,14,90+intensity*36,48+intensity*24,-.20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.8*intensity;ctx.strokeStyle='#ffd45b';ctx.lineWidth=6+intensity*5;ctx.beginPath();ctx.ellipse(-37,14,18,34,0,Math.PI*.58,Math.PI*1.44);ctx.stroke();for(let i=0;i<16;i++){ctx.globalAlpha=(.08+.025*(i%5))*intensity;ctx.strokeStyle=i%2?'#ffcd51':'#ff6231';ctx.lineWidth=2+(i%3);const y=(i-8)*6+Math.sin(state.t*9+i)*5;ctx.beginPath();ctx.moveTo(-42,12+y*.2);ctx.quadraticCurveTo(-86,y,-150-i*8,y*.55);ctx.stroke()}ctx.globalAlpha=1;ctx.restore()}
function drawLiftBubble(){if(!state.running)return;const lift=clamp((22-Math.abs(state.path))/14,0,1);ctx.save();ctx.globalAlpha=.18*lift;ctx.fillStyle='#6df7a7';ctx.beginPath();ctx.ellipse(16,-38,70,24,-.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.72*lift;ctx.strokeStyle='#83ffb8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(54,-22);ctx.lineTo(54,-56);ctx.stroke();ctx.fillStyle='#83ffb8';ctx.beginPath();ctx.moveTo(54,-64);ctx.lineTo(44,-48);ctx.lineTo(64,-48);ctx.closePath();ctx.fill();ctx.restore()}
function drawCapsuleShape(){ctx.save();ctx.fillStyle='#e9f2f6';ctx.strokeStyle='#142330';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-34,-32);ctx.lineTo(30,-20);ctx.quadraticCurveTo(52,0,30,22);ctx.lineTo(-34,34);ctx.quadraticCurveTo(-50,2,-34,-32);ctx.fill();ctx.stroke();ctx.fillStyle=state.heat>45?'#ff7c2e':'#2a333b';ctx.beginPath();ctx.ellipse(-38,2,13,36,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#121a22';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#6ecaff';ctx.beginPath();ctx.arc(13,-5,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawChute(W,H){if(!state.chute||state.chuteBad)return;const cx=W*.5,cy=H*.50;ctx.save();ctx.translate(cx,cy-72);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.6;for(let x=-42;x<=42;x+=14){ctx.beginPath();ctx.moveTo(0,55);ctx.lineTo(x,2);ctx.stroke()}ctx.fillStyle='rgba(255,255,255,.94)';ctx.beginPath();ctx.arc(0,0,58,Math.PI,0);ctx.lineTo(58,0);ctx.quadraticCurveTo(0,25,-58,0);ctx.fill();ctx.strokeStyle='rgba(60,90,110,.8)';ctx.stroke();ctx.restore()}
function drawParticles(W,H){const cx=W*.5,cy=H*.50;particles.forEach(p=>{const a=1-p.age/p.life,x=cx+p.x+p.vx*p.age,y=cy+p.y+p.vy*p.age;ctx.globalAlpha=a*((p.type==='plasma' ? .8 : .55));ctx.fillStyle=p.type==='plasma'?'#ff9a35':'#c7eeff';ctx.beginPath();ctx.arc(x,y,p.r*a+1,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function drawPathMeter(W,H){const x=W*.5-180,y=H-44,w=360,h=18;ctx.save();ctx.fillStyle='rgba(0,0,0,.35)';roundRect(ctx,x,y,w,h,99);ctx.fill();ctx.fillStyle='rgba(255,95,95,.8)';roundRect(ctx,x,y,w*.28,h,99);ctx.fill();ctx.fillStyle='rgba(75,225,135,.88)';ctx.fillRect(x+w*.28,y,w*.46,h);ctx.fillStyle='rgba(255,95,95,.8)';roundRect(ctx,x+w*.74,y,w*.26,h,99);ctx.fill();const pos=clamp((Math.abs(state.path)-5)/(28-5),0,1),px=x+pos*w;ctx.fillStyle='white';ctx.beginPath();ctx.moveTo(px,y-8);ctx.lineTo(px-8,y-19);ctx.lineTo(px+8,y-19);ctx.closePath();ctx.fill();ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText('SHALLOW',x+40,y-24);ctx.fillText('SAFE ENTRY PATH',x+w*.5,y-24);ctx.fillText('STEEP',x+w-35,y-24);if(chuteReady()&&!state.chute){ctx.fillStyle='#ffd13d';ctx.font='bold 18px system-ui';ctx.fillText('CHUTE READY',W*.5,y-54)}ctx.restore()}
function drawHud(){$('phaseTxt').textContent=phase().toUpperCase();$('guideTxt').textContent=guidance();setGauge('heat',state.heat,100,`${Math.round(state.heat)}%`,state.heat>75?'#ff4e62':state.heat>50?'#ff9e3d':'#4be187');setGauge('speed',state.speed,8.2,fmtSpeed(state.speed),'#66caff');setGauge('alt',state.alt,selected.alt,fmtAlt(state.alt),'#ffd13d');const pathVal=Math.abs(state.path),color=pathVal<9||pathVal>22?'#ff9e3d':'#bfa7ff';setGauge('angle',pathVal,28,`${Math.round(pathVal)}° ${pathVal<9?'shallow':pathVal>22?'steep':''}`,color)}
function setGauge(name,val,max,txt,color){$(`${name}Txt`).textContent=txt;const f=$(`${name}Fill`);f.style.width=`${clamp(val/max*100,0,100)}%`;f.style.background=color}
let last=performance.now();function loop(now){const dt=(now-last)/1000;last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
