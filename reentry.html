<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Reentry Challenge</title>
<style>
:root{
  --bg:#07131f;--panel:#102235;--panel2:#172f48;--text:#eef7ff;--muted:#a9c1d6;
  --accent:#ffcc33;--good:#44e582;--warn:#ff9d3b;--bad:#ff4d5e;--blue:#66c7ff;
  font-family: "Atkinson Hyperlegible", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:radial-gradient(circle at top,#15314f,#06101a 62%,#03070c);color:var(--text);height:100dvh;min-height:100dvh}
.app{
  display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);
  gap:10px;padding:10px;max-width:1440px;margin:0 auto;
  height:100dvh;max-height:100dvh;overflow:hidden;
}
.card{background:linear-gradient(180deg,rgba(18,42,64,.94),rgba(9,22,35,.96));border:1px solid rgba(255,255,255,.12);border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.32);overflow:hidden}
.sidebar{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
h1{font-size:28px;line-height:1;margin:0;color:#fff}
.subtitle{color:var(--muted);font-size:15px;line-height:1.35;margin-top:6px}
.mission{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.05);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.mission:hover{transform:translateY(-1px);background:rgba(255,255,255,.08)}
.mission.active{outline:3px solid rgba(255,204,51,.55);background:rgba(255,204,51,.12)}
.mission b{display:block;font-size:16px;margin-bottom:3px}
.mission span{color:var(--muted);font-size:13px;line-height:1.3}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;font-size:15px;color:#05121e;background:linear-gradient(180deg,#ffdc5c,#f5b51a);box-shadow:0 4px 0 rgba(98,70,0,.8);cursor:pointer}
.btn:active,.btn.down{transform:translateY(3px);box-shadow:0 2px 0 rgba(98,70,0,.8)}
.btn.secondary{background:linear-gradient(180deg,#d9f4ff,#70cfff);box-shadow:0 5px 0 rgba(0,68,103,.8)}
.btn.danger{background:linear-gradient(180deg,#ff8a8a,#ff4d5e);box-shadow:0 5px 0 rgba(110,0,10,.8);color:white}
.stage{display:flex;flex-direction:column;min-height:0;height:calc(100dvh - 20px);overflow:hidden}
.topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;border-bottom:1px solid rgba(255,255,255,.12);flex:0 0 auto}
.gauge{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:8px}
.gauge label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.06em}
.bar{height:12px;border-radius:99px;background:rgba(0,0,0,.38);overflow:hidden;margin-top:7px}
.fill{height:100%;width:0%;border-radius:99px;background:var(--blue);transition:width .12s linear}
#canvasWrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;min-height:0;background:#07131f}
.overlay{position:absolute;left:16px;top:16px;background:rgba(3,12,20,.72);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);padding:12px 14px;border-radius:16px;max-width:min(460px,calc(100% - 32px))}
.phase{font-weight:1000;color:var(--accent);font-size:18px;letter-spacing:.03em}
.guidance{margin-top:4px;color:#e9f7ff;font-size:16px;line-height:1.25}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr 110px;gap:8px;padding:8px;border-top:1px solid rgba(255,255,255,.12);background:rgba(3,10,18,.7);flex:0 0 auto}
.report{display:none;position:absolute;right:16px;top:16px;width:min(380px,calc(100% - 32px));background:rgba(8,20,31,.92);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:18px;box-shadow:0 15px 45px rgba(0,0,0,.4)}
.report.show{display:block}
.report h2{margin:0 0 8px;font-size:25px}
.report p{margin:7px 0;color:var(--muted);line-height:1.35}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:1px 6px;color:white}
.small{font-size:13px;color:var(--muted);line-height:1.35}
@media(max-width:860px){
  .app{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
    padding:6px;gap:6px;
  }
  .sidebar{
    order:0;
    max-height:30dvh;
    padding:8px;
  }
  .sidebar h1{font-size:22px}
  .subtitle,.small{font-size:12px}
  #missions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mission{padding:8px;border-radius:12px}
  .mission b{font-size:13px}.mission span{display:none}
  .stage{height:auto;min-height:0}
  .topbar{grid-template-columns:1fr 1fr;padding:6px;gap:6px}
  .gauge{padding:6px}.bar{height:9px}
  .controls{grid-template-columns:1fr 1fr;padding:6px;gap:6px}
  .btn{padding:10px 9px;font-size:13px}
  .overlay{left:8px;top:8px;padding:8px 10px}
  .phase{font-size:14px}.guidance{font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="card sidebar">
    <div>
      <h1>Reentry Challenge</h1>
      <div class="subtitle">Keep the capsule centered, manage heat, and survive the trip home.</div>
    </div>
    <div id="missions"></div>
    <button class="btn" id="startBtn">Start Mission</button>
    <button class="btn secondary" id="resetBtn">Reset Flight</button>
    <div class="small">
      Controls: hold <span class="kbd">▲</span>/<span class="kbd">▼</span> or the buttons below. 
      Deploy the parachute only when you are low and slow.
    </div>
  </aside>

  <main class="card stage">
    <div class="topbar">
      <div class="gauge"><label>HEAT <span id="heatTxt">0%</span></label><div class="bar"><div class="fill" id="heatFill"></div></div></div>
      <div class="gauge"><label>SPEED <span id="speedTxt">0 km/s</span></label><div class="bar"><div class="fill" id="speedFill"></div></div></div>
      <div class="gauge"><label>ALTITUDE <span id="altTxt">0 km</span></label><div class="bar"><div class="fill" id="altFill"></div></div></div>
      <div class="gauge"><label>ANGLE <span id="angleTxt">0°</span></label><div class="bar"><div class="fill" id="angleFill"></div></div></div>
    </div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div class="overlay">
        <div class="phase" id="phaseTxt">READY</div>
        <div class="guidance" id="guideTxt">Pick a mission and start reentry.</div>
      </div>
      <div class="report" id="report">
        <h2 id="reportTitle">Flight Report</h2>
        <p id="reportBody"></p>
        <button class="btn" id="tryAgainBtn">Try Again</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn secondary control" id="upBtn">HOLD NOSE UP ▲</button>
      <button class="btn secondary control" id="downBtn">HOLD NOSE DOWN ▼</button>
      <button class="btn" id="chuteBtn">DEPLOY CHUTE</button>
      <button class="btn danger" id="abortBtn">RESET</button>
    </div>
  </main>
</div>

<script>
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SIM_SPEED = 0.68; // Slower pacing so students can see their choices and the vehicle motion.
const $ = id => document.getElementById(id);
const missions = [
  {id:'train', name:'Training Capsule', vehicle:'capsule', alt:122, speed:7.3, target:1280, help:true,
    desc:'Big corridor, strong guidance, easy splashdown.'},
  {id:'heat', name:'Heat Shield Test', vehicle:'capsule', alt:125, speed:7.9, target:1460, help:false,
    desc:'Use a shallow lifting entry without skipping out.'},
  {id:'target', name:'Target Landing', vehicle:'capsule', alt:118, speed:7.5, target:1180, help:false,
    desc:'Manage heat, then deploy chute near the recovery zone.'},
  {id:'shuttle', name:'Shuttle Glide', vehicle:'shuttle', alt:110, speed:7.2, target:1550, help:false,
    desc:'Fly a lifting glider home without engines or a go-around.'}
];
let selected = missions[0], input={up:false,down:false}, particles=[];
let state, trail=[];

function defaultState(){
  return {
    running:false, outcome:null, t:0,
    alt:selected.alt, speed:selected.speed, range:0,
    pitch:selected.vehicle==='shuttle'?14:18, heat:4, g:0,
    chute:false, chuteBad:false, phase:'Ready',
    xView:0, yScreen:0, skip:0, touchdownSpeed:0,
    controlFlash:0, maxHeat:0, minAlt:selected.alt
  };
}
state = defaultState();

function resize(){
  const r = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(420, Math.floor(r.width));
  const h = Math.max(300, Math.floor(r.height));
  canvas.width = Math.floor(w * devicePixelRatio);
  canvas.height = Math.floor(h * devicePixelRatio);
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize', resize); resize();

function renderMissions(){
  $('missions').innerHTML = missions.map(m=>`
    <div class="mission ${m.id===selected.id?'active':''}" data-id="${m.id}">
      <b>${m.name}</b><span>${m.desc}</span>
    </div>`).join('');
  document.querySelectorAll('.mission').forEach(el=>el.onclick=()=>{
    selected = missions.find(m=>m.id===el.dataset.id);
    state = defaultState(); trail=[]; particles=[]; hideReport(); renderMissions();
  });
}
renderMissions();

function start(){ state = defaultState(); state.running=true; trail=[]; particles=[]; hideReport(); }
function reset(){ state = defaultState(); trail=[]; particles=[]; hideReport(); }
$('startBtn').onclick=start; $('resetBtn').onclick=reset; $('abortBtn').onclick=reset; $('tryAgainBtn').onclick=start;

function setHold(btn,key,val){
  input[key]=val; btn.classList.toggle('down',val);
}
function holdButton(id,key){
  const b=$(id);
  b.addEventListener('pointerdown', e=>{e.preventDefault(); setHold(b,key,true);});
  addEventListener('pointerup', ()=>setHold(b,key,false));
  addEventListener('pointercancel', ()=>setHold(b,key,false));
}
holdButton('upBtn','up'); holdButton('downBtn','down');
addEventListener('keydown',e=>{
  if(e.key==='ArrowUp') input.up=true;
  if(e.key==='ArrowDown') input.down=true;
  if(e.key===' '){ e.preventDefault(); deployChute(); }
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowUp') input.up=false;
  if(e.key==='ArrowDown') input.down=false;
});
$('chuteBtn').onclick=deployChute;

function deployChute(){
  if(!state.running || state.outcome || state.chute) return;
  if(state.alt>24 || state.speed>1.65){
    state.chute=true; state.chuteBad=true; state.outcome='chute';
    end('Parachute Shredded','The parachute opened while the vehicle was still too high or too fast. Wait for LOW + SLOW.');
  } else {
    state.chute=true;
    burst(30,'chute');
  }
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function fmtAlt(a){return a>=10?`${a.toFixed(0)} km`:`${(a*1000).toFixed(0)} m`;}
function fmtSpeed(s){return s>=1?`${s.toFixed(1)} km/s`:`${Math.round(s*1000)} m/s`;}
function phase(){
  if(!state.running) return 'Ready';
  if(state.alt>96) return 'Space';
  if(state.alt>72) return 'Entry Interface';
  if(state.heat>36 && state.speed>2.4) return 'Plasma';
  if(state.alt>18) return selected.vehicle==='shuttle'?'Hypersonic Glide':'Lower Atmosphere';
  if(state.alt>2) return state.chute?'Parachute Descent':'Final Descent';
  return 'Landing';
}
function guidance(){
  if(state.outcome) return 'Review the flight report and try a new path.';
  if(!state.running) return 'Pick a mission and start reentry.';
  if(state.alt>96) return 'The capsule stays centered. Use nose angle to keep the moving path inside the green corridor.';
  if(state.skip>45) return 'Too shallow. Nose down or you will skip away from the atmosphere.';
  if(state.heat>76) return 'Too hot. Raise the nose so the plasma spreads out around the heat shield.';
  if(state.alt<24 && !state.chute && state.speed<1.65) return 'LOW + SLOW: deploy the parachute now.';
  if(state.alt<24 && !state.chute) return 'Still too fast for the chute. Hold nose up to slow down.';
  if(state.chute) return 'Chute is out. Stay steady and aim for a gentle landing.';
  return 'Stay inside the green corridor. Not too steep. Not too shallow.';
}

function update(dt){
  if(!state.running || state.outcome) return;
  dt = Math.min(dt,0.05);
  state.t += dt;
  const control = (input.up?1:0) - (input.down?1:0);
  const targetPitch = selected.vehicle==='shuttle'
    ? clamp(state.pitch + control*75*dt, -10, 32)
    : clamp(state.pitch + control*88*dt, -14, 38);
  state.pitch = lerp(state.pitch, targetPitch, 0.65);
  if(control!==0){
    state.controlFlash=.18;
    for(let i=0;i<2;i++) particles.push({type:'jet', age:0, life:.35, side:control, x:state.range, alt:state.alt, dx:(Math.random()-.5)*8, da:(Math.random()-.5)*1.5});
  }

  const density = clamp(Math.exp(-(state.alt-18)/25),0,1);
  const aoa = Math.abs(state.pitch);
  const lift = density * state.speed * (selected.vehicle==='shuttle'?0.060:0.038) * Math.sin(state.pitch*Math.PI/180);
  let descent = state.speed*(0.42 - lift) + state.pitch*-0.010;
  descent = clamp(descent, state.chute ? 0.016 : 0.05, selected.help ? 2.15 : 2.7);
  if(state.chute) descent *= 0.22;

  const dragCoeff = selected.vehicle==='shuttle'?0.018:0.024;
  const drag = density*state.speed*state.speed*(dragCoeff + aoa*0.00072 + (state.chute?0.42:0));
  state.speed = Math.max(state.chute?0.055:0.18, state.speed - drag*dt);
  state.alt = Math.max(0, state.alt - descent*dt*5.2);
  state.range += state.speed * dt * 92 + Math.cos(state.pitch*Math.PI/180)*dt*18;

  const steepPenalty = clamp((state.pitch-23)/18,0,2);
  const shallowPenalty = clamp((4-state.pitch)/12,0,1.4);
  const heatRate = density*Math.pow(state.speed,2.72)*(0.28 + steepPenalty*0.55);
  state.heat += heatRate*dt - (0.08 + (state.speed<2?0.35:0))*dt;
  if(selected.help && state.heat>78) state.heat -= .22; // training assist
  state.heat=clamp(state.heat,0,120); state.maxHeat=Math.max(state.maxHeat,state.heat);

  if(state.alt>70 && state.speed>5.3 && state.pitch<4){
    state.skip += (4-state.pitch)*dt*2.2;
  } else state.skip = Math.max(0,state.skip-dt*8);

  state.g = clamp(drag*3.6 + density*Math.abs(state.pitch)*0.05,0,9);
  if(state.heat>=100) end('Burned Up','The path was too steep or too fast in thick air. Try holding NOSE UP earlier to spread out the heating.');
  if(state.skip>=100) end('Skipped Out','The path was too shallow. The spacecraft bounced off the upper atmosphere instead of slowing down.');
  if(state.alt<=0){
    state.touchdownSpeed=state.speed;
    const miss = Math.abs(state.range-selected.target);
    if(state.chute && !state.chuteBad && state.speed<0.18 && miss<190) end('Safe Landing',`You survived reentry and landed ${Math.round(miss)} km from the target.`);
    else if(state.chute && !state.chuteBad) end('Hard Landing',`You survived the heat, but touched down too fast or far from the target. Miss: ${Math.round(miss)} km.`);
    else end('Crash Landing','The spacecraft reached the ground without a safe parachute descent.');
  }

  if(state.t % .05 < dt){
    trail.push({range:state.range, alt:state.alt, heat:state.heat, pitch:state.pitch});
    if(trail.length>220) trail.shift();
  }
  particles.forEach(p=>p.age+=dt); particles=particles.filter(p=>p.age<p.life);
  state.controlFlash=Math.max(0,state.controlFlash-dt);
}

function end(title,body){
  if(state.outcome) return;
  state.outcome=title; state.running=false;
  $('reportTitle').textContent=title;
  $('reportBody').innerHTML = `${body}<br><br>
    Max heat: ${Math.round(state.maxHeat)}%<br>
    Final speed: ${fmtSpeed(state.speed)}<br>
    Final range error: ${Math.round(Math.abs(state.range-selected.target))} km`;
  $('report').classList.add('show');
}
function hideReport(){ $('report').classList.remove('show'); }

function burst(n,type){
  for(let i=0;i<n;i++) particles.push({type,age:0,life:1+Math.random()*1.2,x:state.range,alt:state.alt,dx:(Math.random()-.5)*35,da:(Math.random()-.5)*8});
}

function vehicleScreen(){
  const W=canvas.clientWidth,H=canvas.clientHeight;
  // The vehicle stays near the center like the rocket launch camera.
  // Small offsets communicate motion without making the player chase the sprite.
  const altitudeBias = clamp((70-state.alt)/95,-.22,.22);
  const speedBias = clamp((state.speed-3.2)/7,-.10,.10);
  return {
    x: W*.48,
    y: H*.50 + altitudeBias*H*.26 + speedBias*H*.08
  };
}
function worldToScreen(range,alt){
  const W=canvas.clientWidth,H=canvas.clientHeight;
  const ship = vehicleScreen();
  const scaleX = Math.max(0.42, Math.min(0.76, W/1250));
  const scaleY = Math.max(2.8, H/46);
  return {
    x: ship.x + (range - state.range) * scaleX,
    y: ship.y - (alt - state.alt) * scaleY
  };
}
function draw(){
  const W=canvas.clientWidth,H=canvas.clientHeight;
  ctx.clearRect(0,0,W,H);
  drawBackground(W,H);
  drawCorridor(W,H);
  drawTrail();
  drawTarget();
  drawVehicle();
  drawParticles();
  drawHUD();
}
function drawBackground(W,H){
  const p = clamp((130-state.alt)/130,0,1);
  const space = [5,13,27], blue=[62,141,198], orange=[190,91,42], ground=[108,163,112];
  let top = mix(space, blue, clamp((p-.08)/.55,0,1));
  let bottom = mix([8,25,49], orange, clamp((p-.38)/.28,0,1));
  bottom = mix(bottom, ground, clamp((p-.78)/.22,0,1));
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,css(top)); g.addColorStop(1,css(bottom)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Stars drift past the centered capsule.
  ctx.fillStyle='rgba(255,255,255,.8)';
  for(let i=0;i<90;i++){
    const x=(i*97 - state.range*.18 + state.t*8)%(W+40)-20;
    const y=(i*53 + state.alt*1.6)%Math.max(1,H*.62);
    ctx.globalAlpha=clamp(1-p*2,0,.8)*(i%7===0?1:.45);
    ctx.fillRect(x,y,i%9===0?2:1,i%9===0?2:1);
  }
  ctx.globalAlpha=1;

  // Atmospheric streaks sell speed while the capsule stays centered.
  const streakAlpha = clamp((state.speed-1.2)/6,0,.45) * clamp((130-state.alt)/80,0,1);
  ctx.save();
  ctx.globalAlpha=streakAlpha;
  ctx.strokeStyle='rgba(220,245,255,.55)';
  ctx.lineWidth=2;
  for(let i=0;i<26;i++){
    const x=((i*83 - state.range*1.4 + state.t*180)%(W+180))-90;
    const y=(i*47 + state.alt*7)%(H+80)-40;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-70,y+18);ctx.stroke();
  }
  ctx.restore();

  for(let i=0;i<12;i++){
    const y=H*(.36+.04*i)+Math.sin(state.t*.4+i)*8;
    const x=(i*167-state.range*.42)% (W+220)-110;
    ctx.globalAlpha=clamp((p-.55)*2,0,.35);
    cloud(x,y,0.7+(i%3)*.18);
  }
  ctx.globalAlpha=1;

  // Ground only appears late, sliding upward toward the centered capsule.
  const groundRise = clamp((18-state.alt)/18,0,1);
  const gy = lerp(H+80,H-54,groundRise);
  ctx.fillStyle='rgba(65,128,82,.9)';
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.quadraticCurveTo(W*.5,gy-42,W,gy+4); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.fill();
}
function mix(a,b,t){return a.map((v,i)=>Math.round(lerp(v,b[i],t)))}
function css(a){return `rgb(${a[0]},${a[1]},${a[2]})`}
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.72)'; for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(x+j*34*s,y+(j%2)*5,35*s,15*s,0,0,Math.PI*2);ctx.fill();}}
function corridorCenterForRange(range,W,H){
  const look = (range - state.range);
  const slope = H*.00042;
  const heatDrop = clamp((state.heat-65)/60,0,1)*24;
  return vehicleScreen().y + look*slope + Math.sin((range+state.t*20)/260)*10 + heatDrop;
}
function corridorY(x,W,H,upper){
  const ship = vehicleScreen();
  const approxRange = state.range + (x-ship.x)/Math.max(0.42,Math.min(0.76,W/1250));
  const mid = corridorCenterForRange(approxRange,W,H);
  const width = upper ? -50 : 50;
  return mid + width;
}
function drawCorridor(W,H){
  ctx.save();
  ctx.globalAlpha=.95;
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'rgba(68,229,130,.08)');
  grad.addColorStop(1,'rgba(255,204,51,.14)');
  ctx.fillStyle=grad; ctx.beginPath();
  for(let x=40;x<W-40;x+=18) ctx.lineTo(x,corridorY(x,W,H,true));
  for(let x=W-40;x>=40;x-=18) ctx.lineTo(x,corridorY(x,W,H,false));
  ctx.closePath();ctx.fill();

  ctx.strokeStyle='rgba(68,229,130,.82)';ctx.lineWidth=2;ctx.setLineDash([10,8]);
  ctx.beginPath(); for(let x=40;x<W-40;x+=18) ctx.lineTo(x,corridorY(x,W,H,true)); ctx.stroke();
  ctx.strokeStyle='rgba(255,110,80,.76)';
  ctx.beginPath(); for(let x=40;x<W-40;x+=18) ctx.lineTo(x,corridorY(x,W,H,false)); ctx.stroke();
  ctx.setLineDash([]);

  // Center reference crosshair shows that the ship/capsule is the camera anchor.
  const ship=vehicleScreen();
  ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ship.x-18,ship.y);ctx.lineTo(ship.x+18,ship.y);
  ctx.moveTo(ship.x,ship.y-18);ctx.lineTo(ship.x,ship.y+18);ctx.stroke();

  ctx.font='bold 13px system-ui';
  ctx.fillStyle='rgba(220,255,235,.88)';
  ctx.fillText('SAFE ENTRY CORRIDOR',52,corridorY(70,W,H,true)-12);
  ctx.fillStyle='rgba(255,210,150,.85)';
  ctx.fillText('LOWER EDGE = HEAT RISK',W-245,corridorY(W-100,W,H,false)+26);
  ctx.restore();
}
function drawTrail(){
  ctx.save(); ctx.lineWidth=3;
  trail.forEach((p,i)=>{
    const s=worldToScreen(p.range,p.alt);
    const a=i/trail.length*.8;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.heat>55?'#ff7b2e':'#9ee4ff';
    ctx.beginPath();ctx.arc(s.x,s.y,2.4,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1; ctx.restore();
}
function drawTarget(){
  const s=worldToScreen(selected.target,0);
  const visible = state.alt < 35 || Math.abs(s.x-canvas.clientWidth*.5)<canvas.clientWidth*.7;
  if(!visible) return;
  ctx.save();
  ctx.translate(s.x,Math.min(canvas.clientHeight-48, s.y));
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(-90,-8,180,8);
  ctx.fillStyle='rgba(255,204,51,.95)';ctx.fillRect(-55,-18,110,10);
  ctx.strokeStyle='rgba(255,204,51,.45)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-8,95,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText('RECOVERY TARGET',0,-30);
  ctx.restore();
}
function drawVehicle(){
  const s=vehicleScreen();
  state.yScreen=s.y;
  const pitchRad=state.pitch*Math.PI/180;
  ctx.save();
  ctx.translate(s.x,s.y);
  if(state.heat>14 && state.speed>1.8){ drawPlasma(pitchRad); }
  drawLiftArrow(pitchRad);
  ctx.rotate(pitchRad);
  if(selected.vehicle==='shuttle') drawShuttle(); else drawCapsule();
  if(state.chute && !state.chuteBad) drawChute();
  ctx.restore();
}
function drawPlasma(a){
  const intensity=clamp((state.heat-12)/82,0,1);
  const flicker=.75+.25*Math.sin(state.t*18);
  ctx.save();
  ctx.rotate(a);

  // Bow shock wraps around the heat shield instead of drifting behind the sprite.
  const grad=ctx.createRadialGradient(-18,0,8,-18,0,86);
  grad.addColorStop(0,`rgba(255,255,210,${0.18*intensity*flicker})`);
  grad.addColorStop(.28,`rgba(255,188,54,${0.32*intensity*flicker})`);
  grad.addColorStop(.58,`rgba(255,78,28,${0.24*intensity})`);
  grad.addColorStop(1,'rgba(255,70,0,0)');
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.ellipse(-18,0,76+intensity*38,42+intensity*20,0,0,Math.PI*2);
  ctx.fill();

  // Tight bright rim on the heat-shield side.
  ctx.globalAlpha=.65*intensity;
  ctx.strokeStyle='#ffd86a';
  ctx.lineWidth=5+intensity*4;
  ctx.beginPath();
  ctx.ellipse(-29,0,18,34,0,Math.PI*.58,Math.PI*1.42);
  ctx.stroke();

  // Flow streamers peel away from the capsule.
  for(let i=0;i<14;i++){
    const y=(i-7)*7 + Math.sin(state.t*10+i)*4;
    const len=54 + intensity*96 + (i%4)*12;
    ctx.globalAlpha=(.10+.035*(i%5))*intensity;
    ctx.strokeStyle=i%2?'#ffcf54':'#ff5a26';
    ctx.lineWidth=2+(i%3);
    ctx.beginPath();
    ctx.moveTo(-32,y*.35);
    ctx.quadraticCurveTo(-70-len*.3,y,-40-len,y*.55);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawLiftArrow(a){
  if(!state.running) return;
  const len=clamp(state.pitch,0,35)*2.1;
  ctx.save();ctx.globalAlpha=.8;ctx.strokeStyle='#7fffb2';ctx.fillStyle='#7fffb2';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(42,-5);ctx.lineTo(42,-5-len);ctx.stroke();
  ctx.beginPath();ctx.moveTo(42,-8-len);ctx.lineTo(34,6-len);ctx.lineTo(50,6-len);ctx.closePath();ctx.fill();
  ctx.font='bold 11px system-ui';ctx.fillText('LIFT',52,-len*.5);
  ctx.restore();
}
function drawCapsule(){
  ctx.save();
  ctx.fillStyle='#dce8ef';ctx.strokeStyle='#15212c';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-22,-26);ctx.lineTo(24,-18);ctx.quadraticCurveTo(42,0,24,18);ctx.lineTo(-22,26);ctx.quadraticCurveTo(-38,0,-22,-26);ctx.fill();ctx.stroke();
  ctx.fillStyle=state.heat>30?'#ff7b2e':'#202a32';ctx.beginPath();ctx.ellipse(-26,0,10,28,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6ecaff';ctx.beginPath();ctx.arc(10,-4,7,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawShuttle(){
  ctx.save();
  ctx.fillStyle='#edf5f8';ctx.strokeStyle='#182533';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(42,0);ctx.lineTo(5,-15);ctx.lineTo(-32,-10);ctx.lineTo(-18,0);ctx.lineTo(-32,10);ctx.lineTo(5,15);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#232b33';ctx.fillRect(-32,-7,13,14);
  ctx.fillStyle=state.heat>30?'#ff7b2e':'#343d45';ctx.fillRect(0,10,28,6);
  ctx.restore();
}
function drawChute(){
  ctx.save(); ctx.rotate(-state.pitch*Math.PI/180);
  ctx.translate(-92,-18);
  ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.5;
  for(let x=-35;x<=35;x+=14){ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(x,0);ctx.stroke();}
  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();ctx.arc(0,0,48,Math.PI,0);ctx.lineTo(48,0);ctx.quadraticCurveTo(0,20,-48,0);ctx.fill();
  ctx.restore();
}
function drawParticles(){
  particles.forEach(p=>{
    const s=worldToScreen(p.x+p.dx*p.age,p.alt+p.da*p.age);
    const a=1-p.age/p.life; ctx.globalAlpha=a;
    ctx.fillStyle=p.type==='chute'?'#fff':'#b7eaff';
    ctx.beginPath();ctx.arc(s.x,s.y,6*a+2,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawHUD(){
  $('phaseTxt').textContent=phase().toUpperCase();
  $('guideTxt').textContent=guidance();
  setGauge('heat', state.heat, 100, `${Math.round(state.heat)}%`, state.heat>75?'#ff4d5e':state.heat>50?'#ff9d3b':'#44e582');
  setGauge('speed', state.speed, 8, fmtSpeed(state.speed), '#66c7ff');
  setGauge('alt', state.alt, selected.alt, fmtAlt(state.alt), '#ffcc33');
  setGauge('angle', state.pitch+18, 56, `${Math.round(state.pitch)}°`, '#bba1ff');
}
function setGauge(name,val,max,txt,color){
  $(`${name}Txt`).textContent=txt; const f=$(`${name}Fill`); f.style.width=`${clamp(val/max*100,0,100)}%`; f.style.background=color;
}

let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  update(dt * SIM_SPEED); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
